[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "secure-mom-pipeline"
version = "0.5.0"
description = "Filesystem-backed local Secure MOM pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
pipeline-api = "secure_mom_pipeline.api:run"
pipeline-worker = "secure_mom_pipeline.worker:run"
pipeline-export-openapi = "secure_mom_pipeline.openapi_export:run"
mom-llm-service = "secure_mom_llm.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_mom_pipeline", "src/secure_mom_llm"]
